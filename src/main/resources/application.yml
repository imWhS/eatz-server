spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/eatztestdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul

logging.level:
  org.hibernate.SQL: debug

server:
  error:
    whitelabel:
      enabled: false