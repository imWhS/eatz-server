<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header" />
<body>
<div class="container">
    <div th:replace="fragments/bodyHeader :: bodyHeader"/>
    <div class="mt-4">
        <h4 class="text-left mb-3">관리자 로그인</h4>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="text" id="email" name="email" class="form-control" placeholder="이메일 주소를 입력하세요">
            </div>
            <div class="form-group">
                <label for="password">비밀 번호</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="비밀 번호를 입력하세요">
            </div>
            <button type="submit">로그인</button>
        </form>

        <script>
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const loginData = {
                    email: email,
                    password: password
                };

                fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                })
                    .then(response => response.json())
                    .then(data => console.log('Success:', data))
                    .catch(error => console.error('Error:', error));
            });
        </script>

        <hr class="my-4">
        <button type="submit" class="btn btn-dark w-100 mt-3">사용자 등록</button>
    </div>
    </div>



</div>
</body>
</html>
