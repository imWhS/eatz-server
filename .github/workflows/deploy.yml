name: EATZ Auto Deployment

# 스크립트 실행 트리거
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 리포지토리에서 최신 코드를 불러옵니다.
        uses: actions/checkout@v3

      - name: JDK의 환경을 설정합니다.
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle 실행 권한을 부여합니다.
        run: chmod +x gradlew

      - name: Gradle로 빌드합니다. 테스트는 제외합니다.
        run: ./gradlew clean build -x test

      - name: 빌드로 생성된 .jar 바이너리 파일을 EC2로 전송하기 위한 환경을 설정합니다.
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/ec2-user/"
          strip_components: 2

      - name: EC2에서의 deploy 스크립트를 실행합니다.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /home/ec2-user/deploy.sh
